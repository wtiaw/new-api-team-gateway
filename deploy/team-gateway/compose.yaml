name: new-api-team-gateway
services:
  app:
    image: ${NEW_API_IMAGE:?Run start-local.ps1}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18310}:3000"
    environment:
      SQL_DSN: postgresql://gateway:${POSTGRES_PASSWORD:?Generate .env}@postgres:5432/new_api_team_gateway
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?Generate .env}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Generate .env}
      TZ: Asia/Shanghai
      DEFAULT_LANGUAGE: zh-CN
      TRUSTED_PROXIES: none
      SESSION_COOKIE_SECURE: "false"
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "false"
      NODE_NAME: new-api-team-gateway-local
      GOMEMLIMIT: 384MiB
      GOMAXPROCS: "2"
    volumes:
      - app-data:/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://localhost:3000/api/status | grep -q '"success":true'
      interval: 5s
      timeout: 4s
      retries: 40
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: new_api_team_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gateway", "-d", "new_api_team_gateway"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 384m
    restart: unless-stopped
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Generate .env}", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Generate .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 40
    mem_limit: 96m
    restart: unless-stopped
  mock-upstream:
    image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
    command: ["python", "/fixture/mock_server.py"]
    environment:
      MOCK_UPSTREAM_KEY: ${MOCK_UPSTREAM_KEY:?Generate .env}
    volumes:
      - ./mock_server.py:/fixture/mock_server.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    restart: unless-stopped
volumes:
  app-data:
  postgres-data:
